name: Windows Desktop

# 触发（三种都支持）：
#   1) 路径过滤：改动 desktop/** 、lib/** 或 requirements.txt
#   2) 提交前缀：提交信息第一行带 w: / W: / [w] → 强制跑；带 a: / [a] → 跳过
#   3) 手动 / 发版：Actions 页面 Run workflow；或打 tag（desktop-* / v*）
on:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - 'lib/**'
      - 'requirements.txt'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '构建后发布为 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -e
          case "$REF" in
            refs/tags/*) echo "tag push -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$EVENT" != "push" ]; then
            echo "manual -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          first=$(printf '%s' "$MSG" | head -n1)
          echo "commit: $first"
          case "$first" in
            *"[w]"*|w:*|W:*) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *"[a]"*|a:*|A:*) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)               echo "run=true"  >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity import
        run: |
          python -c "import PyQt6, Crypto, requests; print('deps OK')"
          python -c "import sys; sys.path.insert(0,'lib'); import route_gen, rules, run_sim; print('lib OK')"

      # desktop/data 是运行时目录（已忽略），不打进包；app 启动时会自建
      - name: Build exe (onedir)
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name HappyFuck `
            --paths lib `
            --paths desktop `
            --add-data "lib;lib" `
            --add-data "desktop/assets;assets" `
            --distpath dist/desktop --workpath build/desktop `
            desktop/app.py

      - name: Zip
        run: |
          Compress-Archive -Path dist/desktop/HappyFuck/* -DestinationPath dist/desktop/HappyFuck-win64.zip -Force
          Get-ChildItem dist/desktop | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: happyfuck-windows
          path: dist/desktop/HappyFuck-win64.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/desktop/HappyFuck-win64.zip
          generate_release_notes: true
