name: Android APK

# 触发（三种都支持）：
#   1) 路径过滤：改动 android/** 下任何文件
#   2) 提交前缀：提交信息第一行带 a: / A: / [a]  → 强制跑；带 w: / [w] → 跳过
#   3) 手动 / 发版：Actions 页面 Run workflow；或打 tag（android-* / v*）
on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '构建后发布为 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -e
          case "$REF" in
            refs/tags/*) echo "tag push -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$EVENT" != "push" ]; then
            echo "manual -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          first=$(printf '%s' "$MSG" | head -n1)
          echo "commit: $first"
          case "$first" in
            *"[a]"*|a:*|A:*)          echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *"[w]"*|w:*|W:*)          echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)                        echo "run=true"  >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 原始 APK（112MB）不入库，从 Release 资产下载
      - name: Fetch original APK
        env:
          URL: ${{ secrets.ORIG_APK_URL }}
        run: |
          set -e
          if [ -z "$URL" ]; then
            echo "::error title=缺少原始 APK::请在仓库 Secrets 里配置 ORIG_APK_URL（原始 APK 的直链）"
            exit 1
          fi
          mkdir -p /tmp/in
          curl -fL --retry 3 --retry-delay 5 -o /tmp/in/orig.apk "$URL"
          ls -lh /tmp/in/orig.apk
          echo "ORIG_APK=/tmp/in/orig.apk" >> "$GITHUB_ENV"

      - name: Check apktool jar
        run: |
          set -e
          JAR=android/tools/apktool_3.0.3.jar
          test -f "$JAR" || { echo "::error::缺少 $JAR（smali 补丁依赖同版本 apktool）"; exit 1; }
          ls -lh "$JAR"

      - name: Build APK
        env:
          PYTHON: python3
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          bash android/mobile/build_mobile.sh

      - name: Show result
        run: ls -lh android/mobile/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: happyfuck-android-apk
          path: |
            android/mobile/dist/happyfuck_mobile.apk
            android/mobile/dist/*.idsig
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: android/mobile/dist/happyfuck_mobile.apk
          generate_release_notes: true
