name: Android APK

# 触发（三种都支持）：
#   1) 路径过滤：改动 mobile/** 、lib/** 或 scripts/build/**
#   2) 提交前缀：提交信息第一行带 a: / A: / [a] → 强制跑；带 w: / [w] → 跳过
#   3) 手动 / 发版：Actions 页面 Run workflow；或打 tag（android-* / v*）
on:
  push:
    branches: [master, main]
    paths:
      - 'mobile/**'
      - 'lib/**'
      - 'scripts/build/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '构建后发布为 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -e
          case "$REF" in
            refs/tags/*) echo "tag push -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$EVENT" != "push" ]; then
            echo "manual -> run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          first=$(printf '%s' "$MSG" | head -n1)
          echo "commit: $first"
          case "$first" in
            *"[a]"*|a:*|A:*) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *"[w]"*|w:*|W:*) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)               echo "run=true"  >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会去装已经下线的 'tools' 包而报错。
      - name: Setup Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK: $SDK"
          [ -d "$SDK" ] || { echo "::error::找不到预装 Android SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            [ -x "$c" ] && SM="$c" && break
          done
          if [ ! -d "$SDK/build-tools/35.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            [ -n "$SM" ] || { echo "::error::缺少 build-tools 35.0.0 / android-34 且无 sdkmanager"; exit 1; }
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "build-tools;35.0.0" "platforms;android-34"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 原始 APK（112MB）不入库，放在 tag=ci-assets 的 Release 里。
      # 私有仓库资产直链要鉴权，所以用 gh 而不是 curl。
      - name: Fetch original APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p unpacked
          if ! gh release download ci-assets --repo "${{ github.repository }}" \
               --pattern '*.apk' --dir unpacked --clobber; then
            echo "::error title=缺少原始 APK::在仓库建一个 tag 为 ci-assets 的 Release 并上传原版 APK"
            exit 1
          fi
          f=$(ls unpacked/*.apk | head -1)
          mv "$f" unpacked/QQbase.apk
          ls -lh unpacked/QQbase.apk

      - name: Check apktool jar
        run: |
          set -e
          JAR=mobile/vendor/apktool_3.0.3.jar
          test -f "$JAR" || { echo "::error::缺少 $JAR（smali 补丁依赖同版本 apktool）"; exit 1; }
          ls -lh "$JAR"

      - name: Build APK
        env:
          PYTHON: python3
        run: |
          set -e
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          bash mobile/build_mobile.sh

      - name: Show result
        run: ls -lh dist/mobile/

      - uses: actions/upload-artifact@v4
        with:
          name: happyfuck-android-apk
          path: |
            dist/mobile/happyfuck_mobile.apk
            dist/mobile/*.idsig
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mobile/happyfuck_mobile.apk
          generate_release_notes: true
