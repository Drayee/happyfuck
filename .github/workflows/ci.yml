name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译全部源码
        run: python -m compileall -q app tools
      - name: Ruff 静态检查
        run: |
          pip install ruff
          ruff check app tools --select E9,F63,F7,F82 --exclude app/assets

  build-release:
    name: 打包 Windows exe 并发布 Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包 exe
        run: |
          python -m PyInstaller --noconfirm --clean happyfuck.spec
          if (-not (Test-Path dist/HappyFuck.exe)) { Write-Error "HappyFuck.exe 未生成"; exit 1 }

      - name: 压缩产物
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path dist/HappyFuck.exe -DestinationPath "HappyFuck-$ver-windows-x64.zip" -Force
          Get-Item "HappyFuck-$ver-windows-x64.zip" | Select-Object Name, Length

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: HappyFuck ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: HappyFuck-${{ github.ref_name }}-windows-x64.zip
